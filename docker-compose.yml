services:
  db:
    image: postgres:16-alpine
    container_name: biophyslab-db
    environment:
      POSTGRES_USER: biophyslab
      POSTGRES_PASSWORD: biophyslab
      POSTGRES_DB: biophyslab
    ports:
      - "5432:5432"
    volumes:
      - biophyslab_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biophyslab"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  biophyslab_pgdata:
